server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name medimage.ai4tomorrow.online;

    # Keep the normal access log; the second log covers only opaque image URLs.
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/star-images.log star_image_timing if=$star_log_image;

    # Optional, independently generated lossless PNG copies. Missing cache files
    # fall back to originals without involving Python or changing the task.
    location ^~ /_star_image_files/ {
        internal;
        root /var/cache/star-images;
        try_files $uri @star_image_original;
        sendfile on;
        etag on;
        expires off;
        add_header Cache-Control "private, max-age=3600";
    }

    location @star_image_original {
        rewrite ^/_star_image_files/(.*)$ /_star_original_image_files/$1 last;
    }

    # Both original filenames and the cache stay inaccessible to direct clients.
    location ^~ /_star_original_image_files/ {
        internal;
        alias /srv/star-data/;
        sendfile on;
        etag on;
        expires off;
        add_header Cache-Control "private, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
