# Install in /etc/nginx/conf.d/ (http context). No IPs or answer data are logged.
map $request_uri $star_log_image {
    default 0;
    ~^/image/ 1;
}

log_format star_image_timing escape=json
    '{"time":"$time_iso8601","request":"$request_uri","status":$status,'
    '"body_bytes":$body_bytes_sent,"content_length":"$sent_http_content_length",'
    '"seconds":$request_time,"complete":"$request_completion",'
    '"upstream_seconds":"$upstream_response_time","range":"$http_range",'
    '"content_range":"$sent_http_content_range"}';
